# COVE_CLAUDE_SITE_V1 - only gege.lumi.org.cn; other sites are untouched.
server {
    listen 80;
    listen [::]:80;
    server_name gege.lumi.org.cn;

    # Widget Listener SSE: protected by short-lived single-use session tokens in the bridge.
    location = /listener/events {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Everything else goes through the OAuth gateway (MCP, metadata, consent, audio clips).
    location / {
        proxy_pass http://127.0.0.1:8798;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2m;
        access_log off; # request lines can carry one-time codes
    }
}
